<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Me Ask Claude For You</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1 class="logo">CLAUDE<br>CODE</h1>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Creation Mode -->
            <div id="creation-mode" class="mode-container hidden">
                <div class="terminal-box">
                    <div class="terminal-header">
                        <span class="asterisk">*</span> Welcome to LMACFY
                    </div>
                    <div class="input-wrapper">
                        <span class="prompt-symbol">&gt;</span>
                        <input type="text" id="prompt-input" placeholder="Enter your prompt..." autofocus autocomplete="off">
                        <button id="generate-btn">[GENERATE]</button>
                    </div>
                </div>
                
                <div id="result-container" class="hidden">
                    <p class="success-msg">🎉 Link generated successfully. Press [COPY] to continue.</p>
                    <div class="copy-wrapper">
                        <input type="text" id="generated-link" readonly>
                        <button id="copy-btn">[COPY]</button>
                    </div>
                    <a id="preview-link" href="#" target="_blank">[PREVIEW_LINK]</a>
                </div>
            </div>

            <!-- Animation Mode -->
            <div id="animation-mode" class="mode-container hidden">
                <div class="terminal-box">
                    <div class="terminal-header">
                        <span class="asterisk">*</span> Executing LMACFY sequence
                    </div>
                    <div class="input-wrapper fake-input-wrapper">
                        <span class="prompt-symbol">&gt;</span>
                        <div id="fake-input-text"></div>
                        <button id="fake-send-btn">[SEND]</button>
                    </div>
                </div>
                <div id="fake-cursor">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 2L17 12L12 14L15 21L12 22L9 15L4 18L7 2Z" fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div id="snarky-message" class="hidden">🎉 Task completed. Was that so hard?</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
